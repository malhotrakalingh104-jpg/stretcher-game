name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: unzip -o games.zip || unzip -o .github/workflows/games.zip || unzip -o game.zip.zip
      - run: |
          cd $(find . -name package.json | head -1 | xargs dirname)
          npm install
          npm run build
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: your-apk
          path: '**/app-debug.apk'
