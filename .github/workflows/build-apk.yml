name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Build
        run: |
          ls -la
          unzip -o "game.zip.zip" || unzip -o "game.zip" || unzip -o *.zip
          DIR=$(find . -name "package.json" -type f | head -1 | xargs dirname)
          echo "Project at: $DIR"
          cd "$DIR"
          npm install
          npm run build
          npx cap add android || true
          npx cap copy android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: your-apk
          path: "**/app-debug.apk"
