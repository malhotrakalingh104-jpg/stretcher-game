name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Unzip Game
        run: |
          echo "Searching for zip files..."
          find . -name "*.zip" -type f
          echo "Unzipping all zips..."
          find . -name "*.zip" -exec unzip -o {} \;
          find . -name "*.zip" -exec unzip -o {} -d extracted \; || true
          unzip -o ".github/workflows/games.zip" -d . || true
          unzip -o "games.zip" -d . || true
          unzip -o "*.zip" -d . || true
          echo "Listing files..."
          ls -la
          find . -name "package.json" | head -10

      - name: Build APK
        run: |
          PROJ=$(find . -name "package.json" -type f | grep -v node_modules | head -1 | xargs dirname)
          echo "Building in folder: $PROJ"
          if [ -z "$PROJ" ]; then echo "package.json NOT FOUND!"; ls -la; exit 1; fi
          cd "$PROJ"
          npm install
          npm run build || echo "build done"
          npx cap add android || true
          npx cap copy android
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: your-apk
          path: "**/app-debug.apk"
